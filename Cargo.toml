[workspace]
resolver = "2"
members = [
    "control",
    "protocols",
    "shared",
]
default-members = [
    ".",
    "control",
    "protocols",
    "shared",
]

[package]
name = "dae-rs"
version = "0.1.0"
edition = "2021"
description = "An eBPF-based proxy system - Rust rewrite of dae"

[dependencies]
tokio = { version = "1", features = ["full"] }
socket2 = "0.5"
nix = { version = "0.31", features = ["net", "feature", "sched", "user"] }
caps = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipnet = "2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.7", features = ["cors", "auth"] }
socks5-proto = "0.4"

# Safely convert #[repr(C)] structs to/from byte slices
bytemuck = { version = "1", features = ["derive"] }

control = { path = "control" }
protocols = { path = "protocols" }
shared = { path = "shared" }

# Global memory allocator (dae-rs only supports Linux)
# The gnu target uses jemalloc (better performance under multithreading, less fragmentation)
# The musl target uses mimalloc (lightweight and compatible with musl)
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemallocator = { version = "0.7", features = ["unprefixed_malloc_on_supported_platforms"] }

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[profile.release]
strip = true
