[workspace]
resolver = "2"
members = [
    "control",
    "protocols",
    "shared",
]
default-members = [
    ".",
    "control",
    "protocols",
    "shared",
]

[package]
name = "dae-rs"
version = "0.1.0"
edition = "2021"
description = "An eBPF-based proxy system - Rust rewrite of dae"

[dependencies]
tokio = { version = "1", features = ["full"] }
socket2 = "0.5"
nix = { version = "0.31", features = ["net", "feature", "sched", "user"] }
caps = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipnet = "2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.7", features = ["cors", "auth"] }
socks5-proto = "0.4"

# 安全地将 #[repr(C)] 结构体转换到/从字节切片
bytemuck = { version = "1", features = ["derive"] }

control = { path = "control" }
protocols = { path = "protocols" }
shared = { path = "shared" }

# 全局内存分配器（dae-rs 仅支持 Linux）
# gnu 目标使用 jemalloc（多线程下性能好、碎片少）
# musl 目标使用 mimalloc（轻量且与 musl 兼容）
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemallocator = { version = "0.7", features = ["unprefixed_malloc_on_supported_platforms"] }

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[profile.release]
strip = true
