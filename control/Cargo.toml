[package]
name = "control"
version = "0.1.0"
edition = "2021"

[dependencies]
# libbpf-rs: 用户空间 eBPF 管理（替代 aya）
libbpf-rs = "0.24"
# libbpf-sys: libbpf C 库的 Rust FFI 绑定
libbpf-sys = "1.4"
# 安全地进行结构体↔字节转换
bytemuck = { version = "1", features = ["derive"] }

tokio = { version = "1", features = ["full"] }
nix = { version = "0.31", features = ["net", "sched", "signal", "process", "mount", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
socket2 = { version = "0.5", features = ["all"] }
ipnet = "2"
libc = "0.2"
regex = "1"
rtnetlink = "0.21"
netlink-packet-route = "0.21"

axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "auth", "trace"] }
chrono = "0.4"
shared = { path = "../shared" }
protocols = { path = "../protocols" }

[build-dependencies]
libbpf-cargo = "0.24"

[dev-dependencies]
tower = "0.5"
