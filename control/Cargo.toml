[package]
name = "control"
version = "0.1.0"
edition = "2021"

[dependencies]
aya = "0.13"
aya-log = "0.2"
tokio = { version = "1", features = ["full"] }
nix = { version = "0.29", features = ["net", "sched", "signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
socket2 = "0.5"
ipnet = "2"
libc = "0.2"
regex = "1"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "auth", "trace"] }
chrono = "0.4"
shared = { path = "../shared" }
protocols = { path = "../protocols" }

[dev-dependencies]
tower = "0.5"
