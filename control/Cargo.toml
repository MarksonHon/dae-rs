[package]
name = "control"
version = "0.1.0"
edition = "2021"

[dependencies]
# libbpf-rs: userspace eBPF management (replaces aya)
libbpf-rs = "0.24"
# libbpf-sys: Rust FFI bindings for the libbpf C library
# Vendored is enabled uniformly (libbpf + elfutils libelf + zlib are all built from source
# and statically linked by zig cc):
# - When cross-compiling (musl / aarch64-gnu), the host's libelf/libz are glibc/x86_64 and cannot be used
# - On x86_64-gnu, mismatched system headers vs the glibc version built into zig cause missing
#   __isoc23_* symbols, so even the gnu target does not depend on the system libelf, keeping build
#   behavior consistent across all Linux targets
libbpf-sys = { version = "1.4", features = ["vendored"] }
# Safely convert between structs and bytes
bytemuck = { version = "1", features = ["derive"] }

tokio = { version = "1", features = ["full"] }
nix = { version = "0.31", features = ["net", "sched", "signal", "process", "mount", "fs"] }
# "rc" enables Serialize/Deserialize for Arc<T> (used by RuleSetData's Arc-wrapped lists)
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
futures = "0.3"
fastrand = "2"
socket2 = { version = "0.5", features = ["all"] }
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
regex = "1"
bincode = "1"
# Rule-set download: HTTP client (SOCKS5 proxy + rustls TLS, consistent with the existing rustls
# stack; default TLS disabled to avoid openssl)
reqwest = { version = "0.12", default-features = false, features = ["socks", "rustls-tls-native-roots"] }
# Rule-set file sha256 verification
sha2 = "0.10"
rtnetlink = "0.21"
netlink-packet-route = "0.21"

axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "auth", "trace"] }
chrono = "0.4"
subtle = "2"
shared = { path = "../shared" }
protocols = { path = "../protocols" }

# Cross-compilation requires autotools on the host: autoreconf/autopoint/flex/bison/gawk
# (musl builds additionally need musl versions of argp/fts/obstack, see the musl-deps step in
# .github/workflows/build.yml)

[build-dependencies]
libbpf-cargo = "0.24"

[dev-dependencies]
tower = "0.5"
# Rule-set storage/download unit tests use a temporary directory
tempfile = "3"
# Rule-set scheduler tests: paused time (start_paused / tokio::time::advance)
tokio = { version = "1", features = ["test-util"] }
