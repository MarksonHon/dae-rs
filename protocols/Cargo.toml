[package]
name = "protocols"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
socket2 = "0.5"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socks5-proto = "0.4"
thiserror = "2"
tracing = "0.1"
anyhow = "1"
libc = "0.2"
shared = { path = "../shared" }
hex = "0.4"
sha2 = "0.10"

# Shadowsocks
shadowsocks = { version = "1.20", optional = true }

# TLS (Trojan, TUIC, Juicity, VMess)
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
rustls-pemfile = { version = "2", optional = true }
webpki-roots = { version = "0.26", optional = true }
tokio-rustls = { version = "0.26", optional = true }

# QUIC (TUIC, Juicity)
quinn = { version = "0.11", optional = true }

# WebSocket (VMess)
tokio-tungstenite = { version = "0.24", optional = true }
tungstenite = { version = "0.24", optional = true }

# HTTP/2 (VMess)
h2 = { version = "0.4", optional = true }
http = { version = "1", optional = true }

# gRPC (VMess)
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }

# Base64 decoding (v2rayN format)
base64 = { version = "0.22", optional = true }

[features]
default = ["shadowsocks", "trojan", "tuic", "juicity", "vmess"]
socks = []
shadowsocks = ["dep:shadowsocks"]
trojan = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]
tuic = ["dep:rustls", "dep:quinn", "dep:base64"]
juicity = ["dep:rustls", "dep:quinn"]
vmess = ["dep:rustls", "dep:tokio-tungstenite", "dep:h2", "dep:http", "dep:base64"]
