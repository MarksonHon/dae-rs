[package]
name = "protocols"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
socket2 = "0.5"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socks5-proto = "0.4"
thiserror = "2"
tracing = "0.1"
anyhow = "1"
libc = "0.2"
shared = { path = "../shared" }
hex = "0.4"
sha2 = "0.10"

# Shadowsocks (crypto layer only: AEAD framing + 2022 ciphers)
shadowsocks-crypto = { version = "0.6", optional = true, features = ["v2"] }
blake3 = "1"

# VMess / Shadowsocks crypto
md-5 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
aes = { version = "0.8", optional = true }
aes-gcm = { version = "0.10", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
sha3 = { version = "0.10", optional = true }
crc32fast = { version = "1", optional = true }

# TLS (Trojan, TUIC, Juicity, VMess)
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
rustls-pemfile = { version = "2", optional = true }
webpki-roots = { version = "0.26", optional = true }
tokio-rustls = { version = "0.26", optional = true }

# QUIC (TUIC, Juicity)
quinn = { version = "0.11", optional = true }

# WebSocket (VMess)
tokio-tungstenite = { version = "0.24", optional = true }
tungstenite = { version = "0.24", optional = true }
futures-util = { version = "0.3", optional = true }

# HTTP/2 (VMess)
h2 = { version = "0.4", optional = true }
http = { version = "1", optional = true }

# gRPC (VMess)
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }

# Base64 decoding (v2rayN format)
base64 = { version = "0.22", optional = true }

[features]
default = ["shadowsocks", "trojan", "tuic", "juicity", "vmess"]
socks = []
shadowsocks = ["dep:shadowsocks-crypto"]
trojan = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]
tuic = ["dep:rustls", "dep:quinn", "dep:base64"]
juicity = ["dep:rustls", "dep:quinn"]
vmess = ["dep:rustls", "dep:tokio-tungstenite", "dep:h2", "dep:http", "dep:base64", "dep:futures-util", "dep:md-5", "dep:hmac", "dep:aes", "dep:aes-gcm", "dep:chacha20poly1305", "dep:sha3", "dep:crc32fast"]
